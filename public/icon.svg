<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.3" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.4" />

  <!-- Glowing Orb Core -->
  <circle cx="256" cy="256" r="115" fill="url(#orbGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="110" fill="url(#orbGrad)" />

  <!-- Internal Glass highlight -->
  <ellipse cx="230" cy="205" rx="55" ry="25" fill="#ffffff" opacity="0.35" transform="rotate(-25 230 205)" />

  <!-- Letter S Monogram -->
  <path d="M 285 200 C 285 180 268 165 245 165 C 220 165 205 180 205 200 C 205 220 220 230 250 242 C 285 256 305 272 305 305 C 305 338 278 355 245 355 C 210 355 188 335 185 305" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>
